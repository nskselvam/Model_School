
# ═══════════════════════════════════════════════════════════════════════════
# HIGH-PERFORMANCE NGINX CONFIGURATION
# System  : 64 GB RAM, 32 CPU Cores
# Backend : 15 PM2 Node.js cluster instances on port 8000
# Domain  : dems.srmist.edu.in
#
# OPTIMIZATIONS:
# - Direct Image Loading: Zero-copy sendfile for JPEG images in ImgImp folder
# - Kernel-level file transfer with directio for files >4MB
# - Aggressive caching (max-age=31536000) for immutable valuation images
# - Disabled access logging on image requests for maximum throughput
# - Range request support for partial image loading
# - CORS enabled for frontend access
# ═══════════════════════════════════════════════════════════════════════════

user www-data;
worker_processes auto;                    # One worker per CPU core
worker_cpu_affinity auto;                 # Pin workers to CPU cores
worker_rlimit_nofile 200000;              # Max open files per worker
worker_shutdown_timeout 30s;              # Graceful shutdown

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

# Load dynamic modules (if any)
# include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 16384;             # 16K connections per worker
    use epoll;                            # Linux high-performance event model
    multi_accept on;                      # Accept multiple connections at once
    accept_mutex off;                     # Better for high-traffic
}

http {
    # ─── Basic Settings ───────────────────────────────────────────────────
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    charset utf-8;
    server_tokens off;                    # Hide nginx version
    
    # DNS resolver for external API calls (Google + Cloudflare)
    resolver 8.8.8.8 1.1.1.1 valid=300s ipv6=off;
    resolver_timeout 5s;

    # ─── Logging ──────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    log_format json_combined escape=json
        '{'
            '"time":"$time_iso8601",'
            '"remote_addr":"$remote_addr",'
            '"request":"$request",'
            '"status":$status,'
            '"bytes":$body_bytes_sent,'
            '"referer":"$http_referer",'
            '"user_agent":"$http_user_agent",'
            '"request_time":$request_time,'
            '"upstream_time":"$upstream_response_time"'
        '}';

    access_log /var/log/nginx/access.log main buffer=64k flush=5s;

    # ─── Performance Tuning ───────────────────────────────────────────────
    sendfile on;
    sendfile_max_chunk 512k;
    tcp_nopush on;
    tcp_nodelay on;
    
    keepalive_timeout 75s;
    keepalive_requests 10000;             # Reuse connections more
    reset_timedout_connection on;
    
    types_hash_max_size 2048;
    server_names_hash_bucket_size 128;
    
    # Open file cache (speeds up static file serving)
    open_file_cache max=200000 inactive=30s;
    open_file_cache_valid 60s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;
    
    # ─── File Upload / Body Sizes ─────────────────────────────────────────
    client_body_buffer_size 256k;
    client_max_body_size 500M;            # Large uploads (Excel/PDF)
    client_header_buffer_size 8k;
    large_client_header_buffers 8 32k;
    client_body_temp_path /var/cache/nginx/client_temp 1 2;
    
    # ─── Timeouts ─────────────────────────────────────────────────────────
    client_body_timeout 120s;
    client_header_timeout 60s;
    send_timeout 120s;
    
    # Default proxy timeouts (override per-location as needed)
    proxy_connect_timeout 60s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
    
    # ─── Buffer Sizes ─────────────────────────────────────────────────────
    proxy_buffer_size 16k;
    proxy_buffers 16 16k;
    proxy_busy_buffers_size 32k;
    proxy_temp_file_write_size 256k;
    proxy_max_temp_file_size 1024m;
    proxy_temp_path /var/cache/nginx/proxy_temp 1 2;
    
    # ─── Gzip Compression ─────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;                    # Sweet spot (4-6)
    gzip_min_length 1024;
    gzip_disable "msie6";
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        application/atom+xml
        application/rss+xml
        application/vnd.ms-fontobject
        application/x-font-ttf
        application/x-font-opentype
        font/opentype
        font/ttf
        font/woff
        font/woff2
        image/svg+xml
        image/x-icon;

    # ─── Brotli (if module available - uncomment to enable) ───────────────
    # brotli on;
    # brotli_comp_level 5;
    # brotli_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # ─── Upstream Backend (PM2 Node.js cluster) ───────────────────────────
    upstream backend_nodejs {
        least_conn;                       # Route to least-busy worker
        
        server 127.0.0.1:8000 max_fails=3 fail_timeout=30s;
        # Add more if scaling horizontally:
        # server 127.0.0.1:8001 max_fails=3 fail_timeout=30s;
        
        keepalive 256;                    # Idle keepalive connections
        keepalive_timeout 120s;
        keepalive_requests 10000;
    }

    # ─── Rate Limiting Zones ──────────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=api_limit:20m rate=100r/s;
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=upload_limit:10m rate=20r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;
    
    # Status codes for rate limiting
    limit_req_status 429;
    limit_conn_status 429;

    # ─── Map for caching control ──────────────────────────────────────────
    map $sent_http_content_type $expires {
        default                 off;
        text/html               1h;
        text/css                1y;
        application/javascript  1y;
        ~image/                 1y;
        ~font/                  1y;
    }

    # ─── HTTP → HTTPS Redirect (uncomment when SSL is configured) ─────────
    # server {
    #     listen 80;
    #     listen [::]:80;
    #     server_name dems.srmist.edu.in;
    #     return 301 https://$host$request_uri;
    # }

    # ─── Main Server Block ────────────────────────────────────────────────
    server {
        listen 80 default_server backlog=4096;
        listen [::]:80 default_server backlog=4096;
        server_name dems.srmist.edu.in;

        root /var/www/html;
        index index.html index.htm;

        # ─── Security Headers ─────────────────────────────────────────────
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;  # Enable with HTTPS

        # ─── Common Proxy Settings (reused via include or repeated) ───────
        # Defined per-location below

        # ═════════════════════════════════════════════════════════════════
        # Internal Protected Uploads (X-Accel-Redirect from Node.js backend)
        # ═════════════════════════════════════════════════════════════════
        location /protected-uploads/ {
            internal;  # Only accessible via X-Accel-Redirect from backend
            alias /var/osmsbackend/uploads/;
            
            # High-performance direct file serving
            sendfile on;
            tcp_nopush on;
            tcp_nodelay on;
            
            # Direct I/O for large files
            directio 4m;
            directio_alignment 512;
            
            # Force JPEG MIME type
            types { }
            default_type image/jpeg;
            
            # No logging for performance
            access_log off;
            log_not_found off;
        }

        # ═════════════════════════════════════════════════════════════════
        # Serve Backend Uploads (JPEG Images & PDFs for Valuation)
        # DIRECT IMAGE LOADING - Optimized for High Performance
        # ═════════════════════════════════════════════════════════════════
        
        # Ultra-fast direct serving for valuation images (ImgImp folder)
        # Pattern: /uploads/May_2026/ImgImp/03/82193814/82193814_01_TE24101T.jpg
        # This location is checked first for ImgImp images (higher priority)
        location ~ ^/uploads/[^/]+/ImgImp/.+\.(jpg|jpeg|JPG|JPEG)$ {
            alias /var/osmsbackend/uploads/;
            
            # Enable sendfile for zero-copy transfer (kernel optimization)
            sendfile on;
            tcp_nopush on;
            tcp_nodelay on;
            
            # Use direct I/O for files larger than 4MB (bypasses page cache)
            directio 4m;
            directio_alignment 512;
            
            # Maximum caching - images are immutable after upload
            expires max;
            add_header Cache-Control "public, immutable, max-age=31536000" always;
            
            # CORS headers for browser access
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Range, If-Range" always;
            add_header Access-Control-Expose-Headers "Content-Length, Content-Range" always;
            
            # Security & performance headers
            add_header X-Content-Type-Options "nosniff" always;
            add_header Accept-Ranges bytes always;
            
            # Force JPEG MIME type
            types { }
            default_type image/jpeg;
            
            # No logging for maximum performance
            access_log off;
            log_not_found off;
            
            # Serve file directly, no fallback
            try_files $uri =404;
        }
        
        location /uploads/ {
            alias /var/osmsbackend/uploads/;
            
            # Security: prevent directory listing
            autoindex off;
            
            # Disable access logging for images (reduces I/O)
            access_log off;
            
            # Enable sendfile for direct kernel-level file transfer
            sendfile on;
            tcp_nopush on;
            tcp_nodelay on;
            
            # Enable direct I/O for large files (bypass kernel cache)
            directio 4m;
            directio_alignment 512;
            
            # Allow images and PDFs only
            location ~ \.(jpg|jpeg|JPG|JPEG)$ {
                # Aggressive caching for images (valuation images rarely change)
                expires 7d;
                add_header Cache-Control "public, immutable, max-age=604800";
                add_header X-Content-Type-Options "nosniff" always;
                
                # CORS for frontend access
                add_header Access-Control-Allow-Origin "*" always;
                add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
                add_header Access-Control-Allow-Headers "Range" always;
                
                # Security headers
                add_header X-Frame-Options "SAMEORIGIN" always;
                
                # Support for range requests (partial content)
                add_header Accept-Ranges bytes;
                
                # Optimize MIME type detection
                types { }
                default_type image/jpeg;
                
                # Try exact file match, return 404 if not found
                try_files $uri =404;
                
                # Disable logging for performance
                access_log off;
                error_log /var/log/nginx/image_errors.log error;
            }
            
            # PDF files - separate handling
            location ~ \.(pdf|PDF)$ {
                # Cache PDFs for shorter duration (may be regenerated)
                expires 1h;
                add_header Cache-Control "public, must-revalidate, max-age=3600";
                add_header X-Content-Type-Options "nosniff" always;
                
                # CORS for frontend access
                add_header Access-Control-Allow-Origin "*" always;
                add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
                add_header Access-Control-Allow-Headers "Range" always;
                
                # Security headers
                add_header X-Frame-Options "SAMEORIGIN" always;
                
                # Support for range requests (streaming)
                add_header Accept-Ranges bytes;
                
                # Force proper MIME type
                types { }
                default_type application/pdf;
                
                try_files $uri =404;
                
                # Log PDF access for monitoring
                access_log /var/log/nginx/pdf_access.log main;
            }
            
            # Block access to other file types
            location ~* \.(php|js|html|htm|env|log|sql|bak|sh|py|txt)$ {
                deny all;
                return 403;
            }
        }

        # ═════════════════════════════════════════════════════════════════
        # SMS / OTP API — NO rate limit, NO retries (prevents duplicate SMS)
        # ═════════════════════════════════════════════════════════════════
        location ~ ^/api/(auth/send-otp|auth/verify-otp|sms|password-send|examiner-password-reset) {
            proxy_pass http://backend_nodejs;
            proxy_http_version 1.1;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            
            # Long timeouts (external SMS gateway can be slow)
            proxy_connect_timeout 120s;
            proxy_send_timeout 180s;
            proxy_read_timeout 180s;
            
            # Critical: Don't retry SMS requests (prevents duplicates)
            proxy_next_upstream off;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_ignore_client_abort on;
        }

        # ═════════════════════════════════════════════════════════════════
        # Login Rate Limiting (brute force protection)
        # ═════════════════════════════════════════════════════════════════
        location = /api/auth/login {
            limit_req zone=login_limit burst=20 nodelay;
            limit_conn conn_limit 30;
            
            proxy_pass http://backend_nodejs;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
        }

        # ═════════════════════════════════════════════════════════════════
        # Data Backup & Export (Long-running DB operations)
        # ═════════════════════════════════════════════════════════════════
        location ~ ^/api/data-(backup|export) {
            limit_req zone=upload_limit burst=10 nodelay;
            
            proxy_pass http://backend_nodejs;
            proxy_http_version 1.1;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            
            # Very large timeouts for database operations
            client_max_body_size 500M;
            client_body_timeout 1800s;          # 30 minutes
            send_timeout 1800s;                 # 30 minutes
            
            proxy_connect_timeout 120s;
            proxy_send_timeout 1800s;           # 30 minutes - for large table dumps
            proxy_read_timeout 1800s;           # 30 minutes - for query execution
            
            # Disable buffering for streaming large responses
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_ignore_client_abort off;      # Continue if client disconnects
            
            # Increase buffer sizes for large data transfers
            proxy_buffer_size 64k;
            proxy_buffers 32 64k;
            proxy_busy_buffers_size 128k;
        }

        # ═════════════════════════════════════════════════════════════════
        # PDF & Image File Operations (Upload/Download/Processing)
        # ═════════════════════════════════════════════════════════════════
        location ~ ^/api/(upload|excel|pdf|scanning|common/pdf) {
            limit_req zone=upload_limit burst=40 nodelay;
            
            proxy_pass http://backend_nodejs;
            proxy_http_version 1.1;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            
            # Large file uploads (Images: ~5-10MB, PDFs: up to 50MB)
            client_max_body_size 500M;
            client_body_timeout 600s;
            
            # Extended timeouts for image processing and PDF generation
            proxy_connect_timeout 120s;
            proxy_send_timeout 900s;              # 15 min for large PDF generation
            proxy_read_timeout 900s;              # 15 min for processing
            
            # Increase buffers for large image/PDF responses
            proxy_buffer_size 128k;
            proxy_buffers 8 128k;
            proxy_busy_buffers_size 256k;
            
            # Stream uploads directly to backend (no buffering)
            proxy_request_buffering off;
            proxy_buffering off;                  # Stream PDFs directly to client
            
            # Don't retry PDF generation (may cause duplicates)
            proxy_next_upstream error timeout;
            proxy_next_upstream_tries 1;
        }

        # ═════════════════════════════════════════════════════════════════
        # General API Backend Proxy
        # ═════════════════════════════════════════════════════════════════
        location /api {
            limit_req zone=api_limit burst=100 nodelay;
            limit_conn conn_limit 100;

            proxy_pass http://backend_nodejs;
            proxy_http_version 1.1;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            
            # WebSocket / SSE support
            proxy_set_header Upgrade $http_upgrade;
            proxy_cache_bypass $http_upgrade;
            
            # Disable buffering for streaming/SSE
            proxy_buffering off;
            proxy_request_buffering off;
            
            # Retry policy for general API
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
            proxy_next_upstream_timeout 10s;
        }

        # ═════════════════════════════════════════════════════════════════
        # Static Assets — Long Cache (Hashed by Vite)
        # ═════════════════════════════════════════════════════════════════
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|avif|woff|woff2|ttf|eot|otf)$ {
            expires 1y;
            add_header Cache-Control "public, immutable, max-age=31536000";
            add_header X-Content-Type-Options "nosniff" always;
            
            # CORS for font files and images
            add_header Access-Control-Allow-Origin "*" always;
            
            access_log off;
            try_files $uri =404;
        }
        
        # Specific optimization for JPEG images (separate from hashed assets)
        location ~* \.jpe?g$ {
            expires 1y;
            add_header Cache-Control "public, immutable, max-age=31536000";
            add_header X-Content-Type-Options "nosniff" always;
            
            # Proper MIME type
            types { }
            default_type image/jpeg;
            
            access_log off;
            try_files $uri =404;
        }

        # MJS module files
        location ~* \.mjs$ {
            types { }
            default_type "application/javascript; charset=utf-8";
            expires 1y;
            add_header Cache-Control "public, immutable, max-age=31536000";
            add_header Access-Control-Allow-Origin "*";
            access_log off;
        }

        # WASM files (e.g., for PDF.js rendering)
        location ~* \.wasm$ {
            types { }
            default_type "application/wasm";
            expires 1y;
            add_header Cache-Control "public, immutable, max-age=31536000";
            add_header Cross-Origin-Embedder-Policy "require-corp";
            add_header Cross-Origin-Opener-Policy "same-origin";
            add_header Access-Control-Allow-Origin "*";
            access_log off;
        }
        
        # PDF.js worker files
        location ~* \.worker\.(min\.)?m?js$ {
            types { }
            default_type "application/javascript; charset=utf-8";
            expires 1y;
            add_header Cache-Control "public, immutable, max-age=31536000";
            add_header Access-Control-Allow-Origin "*";
            access_log off;
        }

        # ═════════════════════════════════════════════════════════════════
        # Frontend SPA (React/Vite) — index.html should NOT be cached
        # ═════════════════════════════════════════════════════════════════
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            expires -1;
        }

        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "public, max-age=3600, must-revalidate";
        }

        # ═════════════════════════════════════════════════════════════════
        # Health Check & Monitoring
        # ═════════════════════════════════════════════════════════════════
        location = /health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "healthy\n";
        }

        location = /nginx_status {
            stub_status on;
            access_log off;
            allow 127.0.0.1;
            allow ::1;
            deny all;
        }

        # ═════════════════════════════════════════════════════════════════
        # Security: Block Hidden Files & Sensitive Paths
        # ═════════════════════════════════════════════════════════════════
        location ~ /\.(?!well-known) {
            deny all;
            access_log off;
            log_not_found off;
            return 404;
        }

        location ~* \.(env|git|svn|htaccess|htpasswd|sql|bak|backup|swp|log)$ {
            deny all;
            access_log off;
            log_not_found off;
            return 404;
        }

        # ═════════════════════════════════════════════════════════════════
        # Custom Error Pages
        # ═════════════════════════════════════════════════════════════════
        error_page 429 /429.html;
        location = /429.html {
            internal;
            add_header Content-Type "text/html; charset=utf-8";
            return 429 '<!DOCTYPE html><html><head><title>Too Many Requests</title></head><body><h1>429 - Too Many Requests</h1><p>Please slow down and try again later.</p></body></html>';
        }

        error_page 502 503 504 /50x.html;
        location = /50x.html {
            internal;
            root /usr/share/nginx/html;
        }
    }

    # ─── HTTPS Server Block (uncomment & configure when SSL ready) ────────
    # server {
    #     listen 443 ssl http2 default_server backlog=4096;
    #     listen [::]:443 ssl http2 default_server backlog=4096;
    #     server_name dems.srmist.edu.in;
    #
    #     ssl_certificate     /etc/ssl/certs/dems.srmist.edu.in.crt;
    #     ssl_certificate_key /etc/ssl/private/dems.srmist.edu.in.key;
    #
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    #     ssl_prefer_server_ciphers off;
    #
    #     ssl_session_cache shared:SSL:50m;
    #     ssl_session_timeout 1d;
    #     ssl_session_tickets off;
    #
    #     ssl_stapling on;
    #     ssl_stapling_verify on;
    #
    #     # ... copy all location blocks from above ...
    # }
}
